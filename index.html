<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wingman Flashcard Reviewer</title>
<script>
/* Apply saved theme and accent before first paint to avoid a flash */
try{var t=localStorage.getItem("wingman-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("wingman-accent");if(a&&a!=="blue")document.documentElement.setAttribute("data-accent",a)}catch(e){}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Wingman Flashcard Reviewer</h1>
      <p class="sub">Roles, values, tools, procedures, and policies.</p>
    </div>
    <div class="ctrls">
      <div class="seg" id="themeSeg" role="group" aria-label="Color theme">
        <button type="button" data-mode="auto" aria-pressed="true">Auto</button>
        <button type="button" data-mode="light" aria-pressed="false">Light</button>
        <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
      </div>
      <label class="pick"><span class="dot" aria-hidden="true"></span>
        <select id="accent" aria-label="Accent color">
          <option value="blue">Blue</option>
          <option value="sky">Sky</option>
          <option value="cyan">Cyan</option>
          <option value="teal">Teal</option>
          <option value="green">Green</option>
          <option value="lime">Lime</option>
          <option value="yellow">Yellow</option>
          <option value="orange">Orange</option>
          <option value="red">Red</option>
          <option value="rose">Rose</option>
          <option value="pink">Pink</option>
          <option value="fuchsia">Fuchsia</option>
          <option value="purple">Purple</option>
          <option value="violet">Violet</option>
          <option value="indigo">Indigo</option>
          <option value="brown">Brown</option>
          <option value="slate">Slate</option>
        </select>
      </label>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="mode">
    <span class="lbl" id="startLbl">Start with</span>
    <div class="seg" id="sideSeg" role="group" aria-labelledby="startLbl">
      <button type="button" data-side="term" aria-pressed="true">Term</button>
      <button type="button" data-side="def" aria-pressed="false">Definition</button>
      <button type="button" data-side="mixed" aria-pressed="false">Mixed</button>
    </div>
  </div>
  <div class="stats"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face"><span class="tag" id="tagF"></span><div class="q" id="front"></div><span class="hint" id="hint"></span></div>
      <div class="face b"><span class="tag" id="tagB"></span><div class="a" id="back"></div></div>
    </div>
  </div>
  <div class="done" id="done"><h2>Round complete</h2><p id="sum"></p>
    <div class="row"><button class="btn" id="again">Restart deck</button><button class="btn ok" id="missed">Review missed cards</button></div></div>
  <div id="ctrl">
    <div class="row"><button class="btn" id="prev">Previous</button><button class="btn" id="flipBtn">Flip</button><button class="btn" id="next">Next</button></div>
    <div class="row"><button class="btn no" id="miss">Needs review</button><button class="btn ok" id="got">Got it</button></div>
    <div class="row"><button class="btn" id="shuf">Shuffle</button></div>
    <div class="kb">Keyboard: Space to flip, arrow keys to move, 1 = needs review, 2 = got it</div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
